[project]
name = "telemetry-backend"
version = "0.1.0"
description = "Real-time telemetry dashboard backend with WebSocket streaming, REST APIs, and deterministic anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Telemetry Backend" }]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.32.0",
    "pydantic>=2.9.0,<2.10.0",
    "pydantic-settings>=2.5.0,<2.6.0",
    "httpx>=0.27.0,<0.28.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.14.0,<1.15.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "pyjwt>=2.10.1,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<0.3.0",
    "python-multipart>=0.0.20,<0.1.0",
    "psutil>=6.1.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
package = true
